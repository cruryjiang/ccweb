        // 初始化历史对话
        function initChatHistory() {
            const saved = localStorage.getItem('claude_chat_history');
            if (saved) chatHistory = JSON.parse(saved);

            const savedSessions = localStorage.getItem('claude_sessions');
            if (savedSessions) {
                const parsed = JSON.parse(savedSessions);
                Object.assign(sessions, parsed);
            }

            // 确保当前会话被初始化
            if (!sessions[currentChatId]) {
                sessions[currentChatId] = [];
            }

            saveCurrentChatToHistory();
            renderHistoryList();
        }

        function saveCurrentChatToHistory() {
            const history = sessions[currentChatId] || [];
            const firstUserMsg = history.find(m => m.role === 'user');
            const title = firstUserMsg
                ? (firstUserMsg.content.length > 30 ? firstUserMsg.content.substring(0, 30) + '...' : firstUserMsg.content)
                : '新对话';

            // 保存完整的 HTML 内容
            const messagesDiv = document.getElementById('messages');
            const htmlContent = messagesDiv ? messagesDiv.innerHTML : '';

            const existingIndex = chatHistory.findIndex(h => h.id === currentChatId);
            const item = {
                id: currentChatId,
                title,
                timestamp: Date.now(),
                messageCount: history.length,
                html: htmlContent  // 保存完整 HTML
            };

            if (existingIndex >= 0) {
                chatHistory[existingIndex] = item;
            } else {
                chatHistory.unshift(item);
                if (chatHistory.length > 50) chatHistory.pop();
            }

            localStorage.setItem('claude_chat_history', JSON.stringify(chatHistory));
            localStorage.setItem('claude_sessions', JSON.stringify(sessions));
            renderHistoryList();
        }

        function renderHistoryList() {
            const list = document.getElementById('historyList');
            if (!list) return;

            if (chatHistory.length === 0) {
                list.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-secondary);">暂无历史对话</div>';
                return;
            }

            list.innerHTML = chatHistory.map(item => {
                const date = new Date(item.timestamp).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="history-item ${item.id === currentChatId ? 'active' : ''}" onclick="loadChat('${item.id}')">
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${item.id}')" title="删除对话">×</button>
                        <div class="title">${item.title}</div>
                        <div class="meta">${date} · ${item.messageCount || 0} 条消息</div>
                    </div>
                `;
            }).join('');
        }

        async function deleteChat(chatId) {
            // 确认删除
            if (!confirm('确定要删除这个对话吗？此操作不可恢复。')) {
                return;
            }

            try {
                // 调用后端API删除服务器端数据
                await fetch(`/api/session/${chatId}`, {
                    method: 'DELETE'
                });

                // 从 chatHistory 中移除
                const historyIndex = chatHistory.findIndex(h => h.id === chatId);
                if (historyIndex >= 0) {
                    chatHistory.splice(historyIndex, 1);
                }

                // 从 sessions 中移除
                if (sessions[chatId]) {
                    delete sessions[chatId];
                }

                // 更新 localStorage
                localStorage.setItem('claude_chat_history', JSON.stringify(chatHistory));
                localStorage.setItem('claude_sessions', JSON.stringify(sessions));

                // 如果删除的是当前对话，切换到新会话
                if (chatId === currentChatId) {
                    // 创建新会话
                    const newChatId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    currentChatId = newChatId;
                    sessions[currentChatId] = [];

                    // 重置UI
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = `
                        <div class="message assistant">
                            <div class="avatar">C</div>
                            <div class="message-content">你好！我是 Claude，支持以下快捷命令：

• /brainstorm 想法 - 头脑风暴模式，先探索设计再实现
• /plan 任务 - 文件规划模式，创建任务规划文档

直接输入你的问题或需求即可开始对话。</div>
                        </div>
                    `;

                    // 重置工作目录
                    loadCwd();

                    // 重连 WebSocket
                    if (logWs) {
                        logWs.close();
                    }
                    connectLogWebSocket();
                }

                // 更新历史列表
                renderHistoryList();

                showToast('对话已删除', 'success');
            } catch (e) {
                console.error('删除对话失败:', e);
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        function saveMessageToHistory(role, content) {
            if (!sessions[currentChatId]) {
                sessions[currentChatId] = [];
            }
            sessions[currentChatId].push({ role, content });
            // 限制历史长度
            if (sessions[currentChatId].length > 100) {
                sessions[currentChatId] = sessions[currentChatId].slice(-100);

            // 保存到 localStorage
            localStorage.setItem('claude_sessions', JSON.stringify(sessions));

        async function loadChat(chatId) {
            if (chatId === currentChatId) {
                return;
            }

            // 保存当前对话
            saveCurrentChatToHistory();

            // 重置生成状态
            isGenerating = false;
            isPaused = false;
            if (pauseResolve) {
                pauseResolve();
                pauseResolve = null;
            }

            // 重置按钮状态
            document.getElementById('sendBtn').disabled = false;
            hidePauseBar();

            // 清空待发送的图片
            if (typeof pendingImages !== 'undefined') {
                pendingImages = [];
                if (typeof updateImagePreview === 'function') {
                    updateImagePreview();
                }
            }

            // 切换到新会话
            currentChatId = chatId;

            // 查找历史记录
            const historyItem = chatHistory.find(h => h.id === chatId);
            const messagesDiv = document.getElementById('messages');

            if (historyItem && historyItem.html) {
                // 恢复保存的 HTML 内容
                messagesDiv.innerHTML = historyItem.html;
            } else {
                // 兼容旧数据：从 sessions 恢复
                const history = sessions[chatId] || [];
                messagesDiv.innerHTML = '';

                if (history.length === 0) {
                    // 新会话显示欢迎消息
                    messagesDiv.innerHTML = `
                        <div class="message assistant">
                            <div class="avatar">C</div>
                            <div class="message-content">你好！我是 Claude，支持以下快捷命令：

• /brainstorm 想法 - 头脑风暴模式，先探索设计再实现
• /plan 任务 - 文件规划模式，创建任务规划文档

直接输入你的问题或需求即可开始对话。</div>
                        </div>
                    `;
                } else {
                    for (const msg of history) {
                        addMessage(msg.role, msg.content);
                    }
                }
            }

            // 更新工作目录
            loadCwd();

            // 同步历史消息到后端
            const sessionHistory = sessions[chatId] || [];
            if (sessionHistory.length > 0) {
                try {
                    await fetch(`/api/session/${chatId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ history: sessionHistory })
                    });
                    console.log(`已同步 ${sessionHistory.length} 条历史消息到后端`);
                } catch (e) {
                    console.error('同步历史消息失败:', e);
                }
            }

            // 重连 WebSocket 到新会话
            if (logWs) {
                logWs.close();
            }
            connectLogWebSocket();

            renderHistoryList();
        }

        // WebSocket 日志
        function connectLogWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws/logs/${currentChatId}`;

            try {
                logWs = new WebSocket(wsUrl);

                logWs.onopen = function() {
                    document.getElementById('logStatus').className = 'status connected';
                    document.getElementById('logContent').innerHTML = '';
                };

                logWs.onmessage = function(event) {
                    const log = JSON.parse(event.data);
                    if (log.type === 'pong' || log.type === 'heartbeat') return;

                    const content = document.getElementById('logContent');
                    const entry = document.createElement('div');
                    entry.className = `log-entry log-type-${log.type}`;
                    const time = new Date(log.timestamp * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    // 根据日志类型显示不同的图标
                    let icon = '';
                    switch (log.type) {
                        case 'command': icon = '⚡'; break;
                        case 'prompt': icon = '📤'; break;
                        case 'response': icon = '📥'; break;
                        case 'process': icon = '🔄'; break;
                        case 'process_output': icon = '📝'; break;
                        case 'error': icon = '❌'; break;
                        case 'warning': icon = '⚠️'; break;
                        case 'info': icon = 'ℹ️'; break;
                        case 'system': icon = '⚙️'; break;
                        default: icon = '•';
                    }

                    let html = `<span class="timestamp">${time}</span><span class="log-icon">${icon}</span>${escapeHtml(log.message)}`;

                    // 如果有metadata，添加展开按钮
                    if (log.metadata && Object.keys(log.metadata).length > 0) {
                        const metaId = 'meta_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        html += ` <button class="log-expand-btn" onclick="toggleLogMeta('${metaId}')">展开</button>`;
                        html += `<div id="${metaId}" class="log-metadata" style="display: none;">`;
                        // prompt 和 response 类型优先显示 content 字段
                        if ((log.type === 'prompt' || log.type === 'response') && log.metadata.content) {
                            html += `<pre style="white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto;">${escapeHtml(log.metadata.content)}</pre>`;
                        } else {
                            html += `<pre>${escapeHtml(JSON.stringify(log.metadata, null, 2))}</pre>`;
                        }
                        html += `</div>`;
                    }

                    entry.innerHTML = html;
                    content.appendChild(entry);
                    content.scrollTop = content.scrollHeight;
                };

                logWs.onclose = function() {
                    document.getElementById('logStatus').className = 'status';
                    setTimeout(connectLogWebSocket, 3000);
                };
            } catch (e) {
                console.error('WebSocket 连接失败:', e);
            }
        }

        // 展开/收起日志元数据
        function toggleLogMeta(metaId) {
            const metaDiv = document.getElementById(metaId);
            if (metaDiv) {

        // 生成最终 PPT
        async function generateFinalPPT() {
            addMessage('assistant', '📊 正在生成 PPT 文件...');

            try {
                const response = await fetch('/api/ppt/outline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentChatId,
                        requirement: '根据之前讨论的内容生成 PPT'
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'outline_ready') {
                                    // 大纲已生成，现在生成 PPT 文件
                                    const finalizeResponse = await fetch('/api/ppt/finalize', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ session_id: currentChatId })
                                    });

                                    const finalizeData = await finalizeResponse.json();
                                    if (finalizeData.status === 'ok') {
                                        addMessage('assistant', `✅ **PPT 生成完成！**\n\n📄 文件：${finalizeData.filename}\n📊 共 ${finalizeData.slide_count} 页\n\n[📥 点击下载 PPT](${finalizeData.download_url})`);
                                    } else {
                                        addMessage('assistant', `❌ 生成失败：${finalizeData.message}`);
                                    }
                                } else if (data.type === 'error') {
                                    addMessage('assistant', `❌ 错误：${data.message}`);
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
            } catch (e) {
                addMessage('assistant', `❌ 生成失败：${e.message}\n\n请确保你已经提供了 PPT 需求说明。使用 \`/ppt 需求描述\` 开始。`);
            }
        }

        // 进入 PPT 模式（从头部按钮调用）
        async function streamResponse(message, images = []) {
            const contentDiv = addMessage('assistant', '', true);
            let fullContent = '';

            // 获取当前选择的 Agent
            const agentSelect = document.getElementById('agentSelect');
            const selectedAgent = agentSelect ? agentSelect.value : 'default';

            // 获取当前工作目录
            const effectiveCwd = currentCwd;

            // 获取工具权限设置
            const effectiveTools = getEffectiveTools();

            // 构建请求体，不包含 null 值
            const requestBody = {
                session_id: currentChatId,
                message: message
            };
            if (selectedAgent && selectedAgent !== 'default') {
                requestBody.agent = selectedAgent;
            }
            if (effectiveTools && effectiveTools.length > 0) {
                requestBody.allowed_tools = effectiveTools;
            }
            if (effectiveCwd) {
                requestBody.cwd = effectiveCwd;
            }
            if (currentModel) {
                requestBody.model = currentModel;
            }
            if (images && images.length > 0) {
                requestBody.images = images;
            }

            // 获取权限模式
            const permissionModeSelect = document.getElementById('permissionModeSelect');
            const permissionMode = permissionModeSelect ? permissionModeSelect.value : 'auto';
            requestBody.permission_mode = permissionMode;

            console.log('Sending request:', requestBody);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                showPauseBar();

                while (true) {
                    await waitIfPaused();

                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'content') {
                                    if (contentDiv.querySelector('.loading')) {
                                        contentDiv.innerHTML = '';
                                    }
                                    fullContent += data.text;
                                    contentDiv.innerHTML = formatContent(fullContent);
                                    scrollToBottom();
                                } else if (data.type === 'system') {
                                    // 系统初始化消息
                                    if (contentDiv.querySelector('.loading')) {
                                        contentDiv.innerHTML = '';
                                    }
                                    const model = data.model || '';
                                    const toolCount = (data.tools || []).length;
                                    fullContent += `\n<div class="process-info">⚙️ 模型: ${escapeHtml(model)}，可用工具: ${toolCount} 个</div>`;
                                    contentDiv.innerHTML = formatContent(fullContent);
                                    scrollToBottom();
                                } else if (data.type === 'tool_call') {
                                    // 显示工具调用
                                    if (contentDiv.querySelector('.loading')) {
                                        contentDiv.innerHTML = '';
                                    }
                                    const toolName = data.name || 'unknown';
                                    const toolInput = data.input || {};
                                    const toolId = (data.id || '').substring(0, 8);
                                    // 提取关键参数摘要
                                    let paramSummary = '';
                                    if (toolInput.pattern) paramSummary += `模式: ${toolInput.pattern}  `;
                                    if (toolInput.file_path) paramSummary += `文件: ${toolInput.file_path}  `;
                                    if (toolInput.path) paramSummary += `路径: ${toolInput.path}  `;
                                    if (toolInput.command) paramSummary += `命令: ${toolInput.command.substring(0, 80)}  `;
                                    if (toolInput.query) paramSummary += `查询: ${toolInput.query.substring(0, 80)}  `;
                                    if (toolInput.url) paramSummary += `URL: ${toolInput.url.substring(0, 80)}  `;
                                    if (toolInput.prompt) paramSummary += `提示: ${toolInput.prompt.substring(0, 60)}  `;

                                    const detailId = 'tool-detail-' + toolId + '-' + Date.now();
                                    let toolInfo = `\n<div class="tool-call">🔧 <strong>调用工具:</strong> ${escapeHtml(toolName)}`;
                                    if (paramSummary) {
                                        toolInfo += `<div class="tool-call-params">${escapeHtml(paramSummary.trim())}</div>`;
                                    }
                                    if (Object.keys(toolInput).length > 0) {
                                        toolInfo += `<span class="tool-details-toggle" onclick="document.getElementById('${detailId}').classList.toggle('expanded');this.textContent=this.textContent==='▶ 详情'?'▼ 收起':'▶ 详情'">▶ 详情</span>`;
                                        toolInfo += `<div id="${detailId}" class="tool-details-full">${escapeHtml(JSON.stringify(toolInput, null, 2))}</div>`;
                                    }
                                    toolInfo += `</div>`;
                                    fullContent += toolInfo;
                                    contentDiv.innerHTML = formatContent(fullContent);
                                    scrollToBottom();
                                } else if (data.type === 'tool_result') {
                                    // 显示工具结果
                                    const resultContent = data.content || '';
                                    const summary = data.summary || {};
                                    const toolUseId = (data.tool_use_id || '').substring(0, 8);

                                    // 构建摘要文本
                                    let summaryText = '';
                                    if (summary.numFiles !== undefined) summaryText += `${summary.numFiles} 个文件  `;
                                    if (summary.numLines !== undefined) summaryText += `${summary.numLines} 行  `;
                                    if (summary.resultSize !== undefined) summaryText += `大小: ${summary.resultSize}  `;

                                    const detailId = 'result-detail-' + toolUseId + '-' + Date.now();
                                    let resultHtml = `\n<div class="tool-result">✅ <strong>工具结果</strong>`;
                                    if (summaryText) {
                                        resultHtml += `<div class="tool-result-summary">${escapeHtml(summaryText.trim())}</div>`;
                                    }
                                    if (resultContent) {
                                        const preview = resultContent.length > 120 ? resultContent.substring(0, 120) + '...' : resultContent;
                                        if (!summaryText) {
                                            resultHtml += `<div class="tool-result-summary">${escapeHtml(preview)}</div>`;
                                        }
                                        resultHtml += `<span class="tool-details-toggle" onclick="document.getElementById('${detailId}').classList.toggle('expanded');this.textContent=this.textContent==='▶ 详情'?'▼ 收起':'▶ 详情'">▶ 详情</span>`;
                                        resultHtml += `<div id="${detailId}" class="tool-details-full">${escapeHtml(resultContent)}</div>`;
                                    }
                                    resultHtml += `</div>`;
                                    fullContent += resultHtml;
                                    contentDiv.innerHTML = formatContent(fullContent);
                                    scrollToBottom();
                                } else if (data.type === 'result') {
                                    // 显示费用和耗时
                                    const cost = data.cost != null ? `$${data.cost.toFixed(4)}` : '';
                                    const duration = data.duration != null ? `${(data.duration / 1000).toFixed(1)}s` : '';
                                    let parts = [];
                                    if (cost) parts.push(`费用: ${cost}`);
                                    if (duration) parts.push(`耗时: ${duration}`);
                                    if (parts.length > 0) {
                                        fullContent += `\n<div class="result-info">📊 ${parts.join('  |  ')}</div>`;
                                        contentDiv.innerHTML = formatContent(fullContent);
                                        scrollToBottom();
                                    }
                                } else if (data.type === 'process') {
                                    // 显示过程信息
                                    if (contentDiv.querySelector('.loading')) {
                                        contentDiv.innerHTML = '';
                                    }
                                    const text = data.text;
                                    if (text.trim() && !text.includes('DEBUG')) {
                                        fullContent += `\n<div class="process-info">⚡ ${escapeHtml(text)}</div>`;
                                        contentDiv.innerHTML = formatContent(fullContent);
                                        scrollToBottom();
                                    }
                                } else if (data.type === 'stderr') {
                                    // 显示 stderr 内容
                                    const text = data.text;
                                    if (text.trim() && !text.includes('DEBUG')) {
                                        if (contentDiv.querySelector('.loading')) {
                                            contentDiv.innerHTML = '';
                                        }
                                        fullContent += text;
                                        contentDiv.innerHTML = formatContent(fullContent);
                                        scrollToBottom();
                                    }
                                } else if (data.type === 'done') {
                                    // 如果内容为空，显示提示
                                    if (!fullContent.trim()) {
                                        fullContent = '<span style="color: var(--text-secondary); font-style: italic;">（模型返回内容为空）</span>';
                                        contentDiv.innerHTML = fullContent;
                                    }
                                    // 保存对话历史
                                    saveMessageToHistory('user', message);
                                    saveMessageToHistory('assistant', fullContent);
                                    saveCurrentChatToHistory();
                                    isGenerating = false;
                                    document.getElementById('sendBtn').disabled = false;
                                    hidePauseBar();
                                } else if (data.type === 'error') {
                                    contentDiv.innerHTML = `<span style="color: #e94560;">错误: ${data.message}</span>`;
                                    isGenerating = false;
                                    document.getElementById('sendBtn').disabled = false;
                                    hidePauseBar();
                                }
                            } catch (e) {
                                console.error('解析数据失败:', e);
                            }
                        }
                    }
                }

                // 流结束后，如果仍在生成状态（未收到 done 事件），做兜底处理
                if (isGenerating) {
                    if (!fullContent.trim()) {
                        contentDiv.innerHTML = '<span style="color: var(--text-secondary); font-style: italic;">（模型返回内容为空）</span>';
                    }
                    isGenerating = false;
                    document.getElementById('sendBtn').disabled = false;
                    hidePauseBar();
                }
            } catch (error) {
                contentDiv.innerHTML = `<span style="color: #e94560;">请求失败: ${error.message}</span>`;
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addMessage(role, content, isStreaming = false, images = []) {
            const messages = document.getElementById('messages');

            // 如果有图片，先创建独立的图片行
            if (images && images.length > 0) {
                const imagesRow = document.createElement('div');
                imagesRow.className = `message ${role} has-images-only`;
                imagesRow.innerHTML = `
                    <div class="avatar"></div>
                    <div class="message-images-container">
                        <div class="message-images">
                            ${images.map(img => `
                                <div class="message-image" onclick="openLightbox('${img.base64}')">
                                    <img src="${img.base64}" alt="发送的图片">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                messages.appendChild(imagesRow);
            }

            // 创建消息行（有内容或流式输出时）
            const hasContent = content && content.trim();
            if (isStreaming || hasContent) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                messageDiv.innerHTML = `
                    <div class="avatar">${role === 'user' ? '你' : 'C'}</div>
                    <div class="message-wrapper">
                        <div class="message-content">${isStreaming ? '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div><span class="loading-text">正在思考中...</span></div>' : content}</div>
                    </div>
                `;
                messages.appendChild(messageDiv);
                messages.scrollTop = messages.scrollHeight;
                return messageDiv.querySelector('.message-content');
            }

            messages.scrollTop = messages.scrollHeight;
            return null;
        }

        function formatContent(text) {
            // 保护已注入的 HTML 标签
            let result = text;

            // 处理 markdown 代码块（但不在 HTML 标签内）
            result = result.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
                return `<pre><code>${escapeHtml(code)}</code></pre>`;
            });

            // 处理行内代码（简单的反引号）
            result = result.replace(/`([^`\n]+)`/g, '<code>$1</code>');

            // 处理换行（但不在已有的 div 内）
            result = result.replace(/\n(?!.*<div)/g, '<br>');

            return result;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }

        // 大输入窗口功能
        function openInputModal() {
            const modal = document.getElementById('inputModal');
            const modalTextarea = document.getElementById('modalTextarea');
            const userInput = document.getElementById('userInput');

            // 复制当前输入框内容到模态框
            modalTextarea.value = userInput.value;

            // 显示模态框
            modal.classList.add('active');

            // 聚焦到文本框
            setTimeout(() => modalTextarea.focus(), 100);
        }

        function closeInputModal() {
            const modal = document.getElementById('inputModal');
            const modalTextarea = document.getElementById('modalTextarea');

            modal.classList.remove('active');
            modalTextarea.value = '';
        }

        function handleModalKeyDown(event) {
            if (event.key === 'Escape') {
                closeInputModal();
            }
        }

        function sendFromModal() {
            const modalTextarea = document.getElementById('modalTextarea');
            const userInput = document.getElementById('userInput');

            // 将模态框内容复制到主输入框
            userInput.value = modalTextarea.value;

            // 关闭模态框
            closeInputModal();

            // 发送消息
            if (userInput.value.trim()) {
                sendMessage();
            }
        }

        // 权限请求处理
        let currentPermissionRequest = null;
        let permissionPollingInterval = null;

        function startPermissionPolling() {
            // 每500ms检查一次权限请求
            if (permissionPollingInterval) return;
            permissionPollingInterval = setInterval(checkPermissionRequests, 500);
        }

        function stopPermissionPolling() {
            if (permissionPollingInterval) {
                clearInterval(permissionPollingInterval);
                permissionPollingInterval = null;
            }
        }

        async function checkPermissionRequests() {
            if (!isGenerating) return;

            try {
                const response = await fetch(`/api/permission/${currentChatId}/pending`);
                const data = await response.json();

                if (data.has_pending) {
                    // 获取详细的权限请求
                    const detailResponse = await fetch(`/api/permission/${currentChatId}`);
                    const detailData = await detailResponse.json();

                    if (detailData.requests && detailData.requests.length > 0) {
                        showPermissionModal(detailData.requests[0]);
                    }
                }
            } catch (e) {
                console.error('检查权限请求失败:', e);
            }
        }

        function showPermissionModal(request) {
            currentPermissionRequest = request;
            const modal = document.getElementById('permissionModal');
            const body = document.getElementById('permissionBody');
            const typeBadge = document.getElementById('permissionType');

            // 设置类型标签
            typeBadge.textContent = request.tool_name || '操作请求';

            // 构建内容
            let html = '';

            if (request.tool_name) {
                html += `<div class="permission-tool">
                    <div class="permission-tool-name">🔧 ${request.tool_name}</div>`;

                if (request.args) {
                    html += `<div class="permission-tool-args">${escapeHtml(JSON.stringify(request.args, null, 2))}</div>`;
                }
                html += '</div>';
            }

            if (request.file_path) {
                html += `<div class="permission-info">📁 文件: ${escapeHtml(request.file_path)}</div>`;
            }

            if (request.diff) {
                html += `<div class="permission-diff">
                    <div class="permission-diff-header">📝 文件变更</div>
                    <div class="permission-diff-content">${formatDiff(request.diff)}</div>
                </div>`;
            }

            if (request.message) {
                html += `<div class="permission-info">${escapeHtml(request.message)}</div>`;
            }

            body.innerHTML = html;
            modal.classList.add('active');

            // 停止轮询直到用户响应
            stopPermissionPolling();
        }

        function formatDiff(diff) {
            // 简单的差异格式化
            return diff.split('\n').map(line => {
                if (line.startsWith('+') && !line.startsWith('+++')) {
                    return `<span class="add">${escapeHtml(line)}</span>`;
                } else if (line.startsWith('-') && !line.startsWith('---')) {
                    return `<span class="remove">${escapeHtml(line)}</span>`;
                }
                return escapeHtml(line);
            }).join('\n');
        }

        async function respondPermission(approved) {
            if (!currentPermissionRequest) return;

            const modal = document.getElementById('permissionModal');

            try {
                const response = await fetch('/api/permission/respond', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentChatId,
                        request_id: currentPermissionRequest.id,
                        approved: approved
                    })
                });

                const data = await response.json();
                if (data.status === 'ok') {
                    modal.classList.remove('active');
                    currentPermissionRequest = null;
                    // 恢复轮询
                    if (isGenerating) {
                        startPermissionPolling();
                    }
                }
            } catch (e) {
                console.error('响应权限请求失败:', e);
            }
        }

        function resetContext() {
            // 清除后端会话历史，但保留界面上的对话显示
            fetch('/api/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentChatId })
            });

            // 在界面上插入一条分隔提示
            const messages = document.getElementById('messages');
            const divider = document.createElement('div');
            divider.style.cssText = 'text-align: center; padding: 8px 0; color: var(--text-secondary); font-size: 12px; border-top: 1px dashed var(--border-color); margin: 12px 40px;';
            divider.textContent = '— 上下文已重置，后续消息将不携带以上历史 —';
            messages.appendChild(divider);
            scrollToBottom();

            // 按钮闪烁反馈
            const btn = document.getElementById('resetContextBtn');
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 1500);
        }

        function clearChat() {
            // 先保存当前对话
            saveCurrentChatToHistory();

            // 重置生成状态
            isGenerating = false;
            isPaused = false;
            if (pauseResolve) {
                pauseResolve();
                pauseResolve = null;
            }

            // 重置按钮状态
            document.getElementById('sendBtn').disabled = false;
            hidePauseBar();

            // 清空待发送的图片
            if (typeof pendingImages !== 'undefined') {
                pendingImages = [];
                if (typeof updateImagePreview === 'function') {
                    updateImagePreview();
                }
            }

            // 创建新的会话 ID
            currentChatId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            sessions[currentChatId] = [];

            // 重置界面
            document.getElementById('messages').innerHTML = `
                <div class="message assistant">
                    <div class="avatar">C</div>
                    <div class="message-content">你好！我是 Claude，支持以下快捷命令：

• /brainstorm 想法 - 头脑风暴模式，先探索设计再实现
• /plan 任务 - 文件规划模式，创建任务规划文档
• /ppt 需求 - PPT 制作模式，交互式创建演示文稿

直接输入你的问题或需求即可开始对话。</div>
                </div>
            `;

            // 清除后端会话
            fetch('/api/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentChatId })
            });

            // 重连 WebSocket 到新会话
            if (logWs) {
                logWs.close();
            }
            connectLogWebSocket();

            // 更新工作目录显示
            loadCwd();

            // 更新历史列表
            saveCurrentChatToHistory();
        }

        // 暂停功能
        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                pauseBtn.textContent = '⏸️';
                pauseBtn.title = '暂停生成';
                pauseBtn.classList.remove('resumed');
                if (pauseResolve) { pauseResolve(); pauseResolve = null; }
            } else {
                isPaused = true;
                pauseBtn.textContent = '▶️';
                pauseBtn.title = '继续生成';
                pauseBtn.classList.add('resumed');
            }
        }

        async function waitIfPaused() {
            if (isPaused) {
                await new Promise(resolve => { pauseResolve = resolve; });
            }
        }

        function showPauseBar() {
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.style.display = 'flex';
            pauseBtn.textContent = '⏸️';
            pauseBtn.classList.remove('resumed');
            pauseBtn.title = '暂停生成';
            isPaused = false;
            // 开始权限请求轮询
            startPermissionPolling();
        }

        function hidePauseBar() {
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.style.display = 'none';
            pauseBtn.classList.remove('resumed');
            isPaused = false;
            if (pauseResolve) { pauseResolve(); pauseResolve = null; }
            // 停止权限请求轮询
            stopPermissionPolling();
        }
    </script>
</body>
</html>
